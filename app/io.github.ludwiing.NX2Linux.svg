<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- NX2Linux: un cartucho de juego cuya etiqueta es un prompt de terminal (el juego se vuelve un programa nativo). -->
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff7a45"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="etiqueta" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f2937"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <filter id="sombra" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#2a0a4a" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#fondo)"/>
  <!-- cartucho -->
  <g filter="url(#sombra)">
    <path d="M70 46 H170 L194 70 V198 a14 14 0 0 1 -14 14 H76 a14 14 0 0 1 -14 -14 V60 a14 14 0 0 1 14 -14 Z" fill="#f8fafc"/>
  </g>
  <!-- ranuras de contacto -->
  <g fill="#cbd5e1">
    <rect x="86" y="190" width="10" height="14" rx="2"/>
    <rect x="104" y="190" width="10" height="14" rx="2"/>
    <rect x="122" y="190" width="10" height="14" rx="2"/>
    <rect x="140" y="190" width="10" height="14" rx="2"/>
    <rect x="158" y="190" width="10" height="14" rx="2"/>
  </g>
  <!-- etiqueta con el prompt -->
  <rect x="80" y="74" width="98" height="98" rx="12" fill="url(#etiqueta)"/>
  <path d="M100 102 L124 123 L100 144" fill="none" stroke="#ff7a45" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="130" y="138" width="32" height="11" rx="5.5" fill="#a78bfa"/>
</svg>
